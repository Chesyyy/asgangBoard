<!DOCTYPE html>
<html lang="en">
<head>
  	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">
  	<title>General Chat</title>
  	<style>
    	body {
    	 	background-color: #252525;
    	 	margin: 0;
    	 	font-family: Arial, sans-serif;
    	 	color: #ffffff;
    	 	display: flex;
    	 	justify-content: center;
    	}

    	.page {
    	  	flex: 1;
    	  	border: 5px solid #cfcfcf;
    	  	padding: 15px;
    	  	min-height: 100vh;
    	  	box-sizing: border-box;
    	}

    	.forum-header {
    	  	border-bottom: 5px solid #cfcfcf;
    	  	padding-bottom: 15px;
    	  	margin-bottom: 15px;
    	}	

    	.forum-header a {
    	  	text-decoration: none;
    	  	color: #cfcfcf;
    	  	font-size: 14px;
    	}

    	.forum-header a:hover {
    	  	text-decoration: underline;
    	}

    	.forum-header h1 {
    	  	font-size: 24px;
    	  	font-weight: 700;
    	  	margin: 8px 0 0;
    	  	color: #ffffff;
    	}

    	.discussion {
    	  	border: 5px solid #cfcfcf;
    	  	padding: 15px;
    	  	box-sizing: border-box;
    	}

    	.discussion-title {
    	  	font-size: 13px;
    	  	font-weight: 700;
    	  	letter-spacing: 0.08em;
    	  	text-transform: uppercase;
    	  	color: #cfcfcf;
    	  	border-bottom: 5px solid #cfcfcf;
    	  	padding-bottom: 10px;
    	  	margin-bottom: 15px;
    	}

    	.discussion .giscus,
    	.discussion .giscus-frame {
    	  	width: 100%;
    	  	border: none;
    	}
  	</style>
</head>
<body>
  <div class="page">

    <header class="forum-header">
      	<a href="../index.html">← Back to topics</a>
      	<h1>General Chat</h1>
    </header>

    	<section class="discussion">
    	  	<div class="discussion-title">Discussion</div>

    	  	<script src="https://giscus.app/client.js"
    	          	data-repo="Chesyyy/asgangBoard"
    	          	data-repo-id="R_kgDOU_a3dw"
    	          	data-category="General"
    	          	data-category-id="DIC_kwDOU_a3d84DHQDC"
    	          	data-mapping="title"
    	          	data-strict="0"
    	          	data-reactions-enabled="1"
    	          	data-emit-metadata="0"
    	          	data-input-position="bottom"
    	          	data-theme="dark"
    	          	data-lang="en"
    	          	crossorigin="anonymous"
    	          	async>
    	  	</script>
    	</section>

  	</div>
</body>
</html>
